[workspace]
resolver = "2"
members = ["crates/model", "crates/core", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
zcode-model = { path = "crates/model" }
zcode-core = { path = "crates/core" }

# 通用
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
